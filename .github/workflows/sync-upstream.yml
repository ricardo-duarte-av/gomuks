name: Sync upstream

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mirror_branch:
        description: "Branch mirroring upstream main"
        default: main
      feature_branch:
        description: "Branch carrying the local patches"
        default: dev

env:
  UPSTREAM: https://github.com/gomuks/gomuks.git
  # The branch carrying local patches, with upstream main merged into it. The
  # mirror branch is only ever fast-forwarded from upstream, so it stays a clean
  # mirror.
  MIRROR_BRANCH: ${{ inputs.mirror_branch || 'main' }}
  FEATURE_BRANCH: ${{ inputs.feature_branch || 'dev' }}
  GOTOOLCHAIN: local

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync main and merge into dev
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - name: Check the sync token is present
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is empty. The default GITHUB_TOKEN cannot push"
            echo "::error::workflow-file changes, so the mirror push will fail whenever"
            echo "::error::upstream touches .github/workflows/. Add a repository secret"
            echo "::error::named SYNC_TOKEN (classic PAT with repo + workflow scopes)."
            exit 1
          fi
          echo "SYNC_TOKEN is set (${#SYNC_TOKEN} chars)."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN cannot push changes to files under
          # .github/workflows/, which upstream fast-forwards routinely touch.
          # SYNC_TOKEN must be a classic PAT (repo + workflow scopes), or a
          # GitHub App token that carries the `workflows` permission. The step
          # above guarantees it is set.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          git fetch origin "$MIRROR_BRANCH" "$FEATURE_BRANCH"

      - name: Fast-forward the mirror branch
        id: ff
        run: |
          # A plain `git checkout main` is ambiguous once upstream/main exists.
          git checkout -B "$MIRROR_BRANCH" "origin/$MIRROR_BRANCH"
          if git merge-base --is-ancestor "$MIRROR_BRANCH" upstream/main; then
            if [ "$(git rev-parse "$MIRROR_BRANCH")" = "$(git rev-parse upstream/main)" ]; then
              echo "$MIRROR_BRANCH is already up to date"
              echo "updated=false" >> "$GITHUB_OUTPUT"
            else
              git merge --ff-only upstream/main
              git push origin "$MIRROR_BRANCH"
              echo "updated=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::$MIRROR_BRANCH has diverged from upstream, refusing to fast-forward"
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Merge the mirror into the feature branch
        id: merge
        # Also runs when main was already current, so that a previously failed merge
        # is retried once dev has been fixed, instead of waiting for a new upstream commit.
        if: steps.ff.outcome == 'success'
        run: |
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          # Merge rather than rebase: dev has merge commits, and a rebase would drop
          # them and make every previously resolved conflict come back.
          if git merge-base --is-ancestor "$MIRROR_BRANCH" "$FEATURE_BRANCH"; then
            echo "$FEATURE_BRANCH already contains $MIRROR_BRANCH"
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit "$MIRROR_BRANCH"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sed 's/^/::warning::Conflict in /'
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Merging $MIRROR_BRANCH into $FEATURE_BRANCH conflicts"
          fi

      - name: Set up Go
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Verify the merged branch
        id: verify
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        run: |
          mkdir -p web/dist && touch web/dist/empty
          go build -tags "sqlite_fts5 goolm" ./...
          go test -tags "sqlite_fts5 goolm" ./...
          rm -f web/dist/empty

      - name: Push the merged branch
        if: steps.merge.outputs.merged == 'true' && steps.verify.outcome == 'success'
        run: |
          git push origin "$FEATURE_BRANCH"

      - name: Rebuild the image
        # Pushes made with GITHUB_TOKEN don't trigger workflows, so ask for the build explicitly.
        if: steps.merge.outputs.merged == 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/docker.yml/dispatches" \
            -f "ref=$FEATURE_BRANCH"

      - name: Open an issue if the sync needs a human
        if: failure() || steps.merge.outputs.clean == 'false' || steps.verify.outcome == 'failure'
        env:
          # GITHUB_TOKEN is refused issue creation on this fork, so use the PAT.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream sync needs attention"
          if gh issue list --state open --search "$title in:title" --json title -q '.[].title' | grep -qxF "$title"; then
            echo "An issue is already open, not filing another one"
            exit 0
          fi
          if [ "${{ steps.ff.outputs.diverged }}" = "true" ]; then
            reason="\`$MIRROR_BRANCH\` has diverged from upstream and cannot be fast-forwarded."
          elif [ "${{ steps.merge.outputs.clean }}" = "false" ]; then
            reason="Merging the new \`$MIRROR_BRANCH\` into \`$FEATURE_BRANCH\` hit conflicts."
          else
            reason="\`$MIRROR_BRANCH\` merged into \`$FEATURE_BRANCH\` cleanly, but the build or tests failed."
          fi
          {
            printf '%s\n\n' "$reason"
            printf '`%s` was left untouched. Resolve it locally:\n\n' "$FEATURE_BRANCH"
            printf '```sh\ngit fetch origin\ngit checkout %s\ngit merge origin/%s\n```\n\n' "$FEATURE_BRANCH" "$MIRROR_BRANCH"
            printf '[Workflow run](%s)\n' "$RUN_URL"
          } > /tmp/issue-body.md
          # Make sure the reason is visible in the run itself even if filing the issue fails.
          echo "::error::$reason"
          gh issue create --title "$title" --body-file /tmp/issue-body.md || true
          exit 1
